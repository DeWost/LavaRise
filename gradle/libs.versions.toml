[versions]
paper-api = "1.21.11-R0.1-SNAPSHOT"
adventure-api = "4.17.0"
adventure-minimessage = "5.1.1"
shadow = "9.4.2"
run-task = "2.3.1"
paperweight = "2.0.0-beta.21"
junit = "5.14.4"
mockito = "5.18.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure-api" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure-minimessage" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-task = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
paperweight = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
