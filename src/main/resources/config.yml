# ============================================================
#  LavaRise — Master Configuration
#  All timings are in ticks (20 ticks = 1 second) unless noted.
# ============================================================

# Internal config version — do not edit (used for migration warnings).
config-version: 2

# General settings
general:
  # Language for messages (messages.yml)
  language: "en"
  # Debug mode — logs extra info to console
  debug: false
  # Check GitHub for a newer release on startup (logs only; no auto-download)
  update-check: true
  # Send anonymous usage metrics to bStats (https://bstats.org)
  bstats: true

# ─── Statistics Storage ──────────────────────────────────────
storage:
  # yaml  = single-server file (stats.yml), zero setup (default)
  # mysql = network-wide database (shared across a proxy/BungeeCord network).
  #         The MySQL driver is auto-provided via plugin.yml libraries.
  #         If the connection fails, LavaRise falls back to YAML automatically.
  type: yaml
  # How often (seconds) cached stats are flushed to disk/DB.
  sync-interval: 120
  mysql:
    host: localhost
    port: 3306
    database: lavarise
    username: root
    password: ""
    table-prefix: "lavarise_"
    ssl: false

# ─── Performance Tuning ──────────────────────────────────────
performance:
  # Max blocks placed per server tick during lava rise.
  # Lower = less lag, but slower visual fill.
  # Recommended: 32-128 depending on server hardware.
  # For world-wide survival challenges, raise this substantially.
  max-blocks-per-tick: 64

  # Run the fill engine every N ticks (with N× the block budget) instead of every
  # tick. Same blocks/second, but fewer scheduler passes and chunk packets.
  # 1 = every tick (smoothest), 2-5 = lighter. Default 2.
  engine-interval-ticks: 2

  # Pre-load arena chunks before game starts
  preload-chunks: true

  # NOTE: lava is always written via the NMS engine with physics/lighting
  # bypassed — that is the whole point of the engine and cannot be toggled.

# ─── Default Arena Settings ──────────────────────────────────
# These are defaults for new arenas. Each arena can override.
arena-defaults:
  # Minimum players to start a game
  min-players: 2
  # Maximum players per arena
  max-players: 16
  # Lobby countdown (seconds) after min-players reached
  lobby-countdown: 30
  # Game countdown before lava starts rising (seconds)
  game-countdown: 10
  # Time between each lava rise (ticks) — 20 = 1 second
  lava-rise-interval: 60
  # How many Y-levels the lava rises each interval
  lava-rise-amount: 1
  # Starting Y-level of the lava
  lava-start-y: -64
  # Maximum Y-level the lava can reach (game ends if reached)
  lava-max-y: 320
  # Allow PvP during game
  pvp-enabled: true
  # Allow block breaking
  block-break: true
  # Allow block placing
  block-place: true
  # Keep inventory on death
  keep-inventory: false
  # Allow hunger
  hunger: true

# ─── Gameplay Rules ──────────────────────────────────────────
gameplay:
  # Seconds at the start of a game before the lava begins to rise.
  # Lets players gear up and build. 0 = disabled. PvP stays locked for this whole
  # window (see pvp-during-grace) and opens with an announcement when it ends.
  grace-period: 30

  # Allow PvP during the grace period above. false (default) = players can't fight
  # until the grace window ends and the lava starts rising — a fair gear-up phase.
  pvp-during-grace: false

  # PvP is only enabled once the lava has risen this many blocks (KteRising-style
  # height gate). 0 = PvP follows the arena's pvp flag with no height gate.
  pvp-after-height: 0

  # Quality-of-life: send mined drops straight to the inventory / auto-smelt ores.
  auto-pickup: false
  auto-smelt: false
  # Block natural mob/animal spawns inside active arenas
  deny-mob-spawns: true

  # Battle-royale combat hype: killstreak + multi-kill (double/triple) call-outs.
  killstreaks: true
  # Combat-log protection: leaving while combat-tagged counts as a death (no
  # escaping a fight by disconnecting). combat-tag-seconds = how long a PvP hit
  # keeps you tagged.
  combat-log-protect: true
  combat-tag-seconds: 10
  # Health restored to a player when they get a PvP kill (2 = 1 heart; 0 = off).
  # Rewards winning a fight and keeps the pace aggressive.
  kill-heal: 0

  # Final showdown: when the field narrows to this many players, announce a
  # dramatic finish and make the survivors glow so they can find each other
  # before the lava finishes them.
  final-showdown:
    enabled: true
    players: 2

  # Supply drops: periodically drop a loot chest just above the lava (battle-royale
  # style) to create reasons to fight. Chests are auto-removed when the game ends.
  supply-drops:
    enabled: false
    # Seconds before the first drop, then between drops.
    first-delay: 30
    interval: 45
    # Loot placed in each chest. Format: MATERIAL:AMOUNT[:ENCHANT:LEVEL...]
    items:
      - "GOLDEN_APPLE:2"
      - "DIAMOND_SWORD:1:sharpness:2"
      - "COBBLESTONE:64"
      - "ARROW:16"
  # Bounties: a player who reaches this many kills has a bounty on their head;
  # whoever eliminates them claims it (announced to the arena).
  bounty:
    threshold: 3
    # Bounty value = victim's kills × this (passed to the commands below as {bounty}).
    per-streak: 100
    # Console commands run when a bounty is claimed. Placeholders: {killer},{victim},{bounty}
    # e.g. "eco give {killer} {bounty}" with Vault/an economy plugin.
    commands: []

  # Lava rises faster the longer the game runs.
  acceleration:
    enabled: true
    # Every N seconds, the rise interval is reduced...
    speed-up-every: 30
    # ...by this many ticks.
    reduce-by: 5
    # The rise interval will never drop below this (ticks).
    min-interval: 10

  # Scale lava speed with the number of players still alive
  # (fewer players → faster lava, down to ~50% of the base interval).
  dynamic-speed:
    enabled: true

  # When only a few players remain, the lava goes into overdrive.
  sudden-death:
    enabled: true
    # Trigger when this many players (or fewer) are left.
    players: 3
    # Rise interval during sudden death (ticks).
    interval: 10

  # Keep players inside their arena. Each player gets a PER-PLAYER world border
  # matching the arena footprint, so they physically can't walk out — and it
  # works independently for every arena in the same world (unlike the shrinking
  # world-border below, which is per-world). Strongly recommended: leave on.
  arena-border: true

  # Eliminate a player who drops below the arena floor (dug out, knocked into the
  # void, or otherwise escaped under the map) so nobody can hide outside the arena.
  void-elimination: true
  # Blocks below the arena floor before the void guard triggers (fall-trajectory
  # grace; protects against lag spikes at floor level).
  void-buffer: 5

  # Shrink the world border toward the arena centre as the lava rises.
  # Best on dedicated arena worlds (the border is per-world). NOTE: when
  # arena-border is on, that per-player border is what contains players; this
  # shrinking border is an additional effect for single-arena worlds.
  world-border:
    enabled: false
    # Smallest border size (blocks).
    min-size: 20

  # Periodically hand out building blocks so players can pillar up.
  block-give:
    enabled: true
    # How often (seconds) to give blocks.
    interval: 15
    material: COBBLESTONE
    amount: 1
    # Stop giving once the player holds this many of the block.
    max-stack: 64

  # Items given to each player when the game starts (KTE rising style:
  # blocks to pillar up + tools to fight and mine).
  kit:
    enabled: true
    # Format: MATERIAL:AMOUNT
    items:
      - COBBLESTONE:64
      - STONE_SWORD:1
      - STONE_PICKAXE:1
      - COOKED_BEEF:8

# ─── Procedural / Random Arenas ──────────────────────────────
# Quick-join (/lr join with no arena) sends players to a RANDOM open arena;
# /lr random always builds a fresh one. When none are free, a new arena is
# auto-generated at a random spot, then removed + restored after the game
# (random map rotation). Set game-mode: survival_challenge handled separately.
procedural:
  enabled: true
  # World to carve random arenas in.
  world: world
  # Half-size of the arena cuboid (blocks from the random centre).
  radius: 30
  # Lava vertical range inside the arena.
  lava-start-y: 60
  lava-max-y: 150
  # Random centres are picked within ±(spawn-area / 2) around 0,0.
  spawn-area: 2000
  # If quick-join finds no open arena, generate a fresh random one.
  auto-on-quickjoin: true

# ─── Autonomous Auto-Arena ───────────────────────────────────
# When enabled, the plugin always keeps one open random arena ready and
# rotates automatically: generate → players join → auto-start → reset →
# remove → generate the next. No admin commands needed. Requires procedural.
auto-arena:
  enabled: false
  # How often (seconds) to ensure an open arena exists.
  check-interval: 15
  # Also pull online players who aren't in a game into the open arena.
  auto-join: false

# ─── Kits / Loadouts (KteRising parity) ──────────────────────
# Players vote for a kit in the lobby (/lr vote or the compass); the winning kit
# is given to everyone at game start. KteRising's 7 kits are reproduced below.
#   icon      — GUI item shown in the vote menu
#   countdown — seconds before the lava rises for this kit (KteRising style):
#               "fair" kits get a long build (600), OP kits start fast (30).
#               -1 = use the global gameplay.grace-period instead.
#   items     — MATERIAL:AMOUNT[:ENCHANT:LEVEL...] (levels may exceed vanilla caps)
kits:
  classic:
    label: "<gray>Classic"
    icon: NETHERITE_PICKAXE
    countdown: 600
    items:
      - "NETHERITE_PICKAXE:1:efficiency:5"
      - "COOKED_BEEF:16"
      - "OAK_LOG:16"
  op:
    label: "<red><bold>OP"
    icon: DIAMOND
    countdown: 30
    items:
      - "NETHERITE_PICKAXE:1:efficiency:5"
      - "COOKED_BEEF:64"
      - "DIAMOND:64"
      - "IRON_INGOT:64"
      - "COBBLESTONE:576"
      - "OAK_LOG:64"
  elytra:
    label: "<aqua>Elytra"
    icon: ELYTRA
    countdown: 600
    items:
      - "NETHERITE_PICKAXE:1:efficiency:5"
      - "COOKED_BEEF:16"
      - "OAK_LOG:16"
      - "ELYTRA:1"
      - "FIREWORK_ROCKET:6"
  elytraop:
    label: "<aqua><bold>ElytraOP"
    icon: ELYTRA
    countdown: 30
    items:
      - "NETHERITE_PICKAXE:1:efficiency:5"
      - "COOKED_BEEF:64"
      - "DIAMOND:64"
      - "IRON_INGOT:64"
      - "ELYTRA:1"
      - "FIREWORK_ROCKET:16"
      - "COBBLESTONE:576"
  trident:
    label: "<blue>Trident"
    icon: TRIDENT
    countdown: 600
    items:
      - "NETHERITE_PICKAXE:1:efficiency:5"
      - "COOKED_BEEF:16"
      - "OAK_LOG:16"
      - "TRIDENT:1:riptide:3"
      - "TRIDENT:1:loyalty:3"
  tridentop:
    label: "<blue><bold>TridentOP"
    icon: TRIDENT
    countdown: 30
    items:
      - "NETHERITE_PICKAXE:1:efficiency:5"
      - "COOKED_BEEF:64"
      - "DIAMOND:64"
      - "IRON_INGOT:64"
      - "TRIDENT:1:riptide:3"
      - "TRIDENT:1:loyalty:3:channeling:1"
      - "COBBLESTONE:576"
  ultraop:
    label: "<gold><bold>UltraOP"
    icon: GOLDEN_APPLE
    countdown: 30
    items:
      - "NETHERITE_PICKAXE:1:efficiency:10"
      - "BOW:1:power:5"
      - "ARROW:64"
      - "GOLDEN_APPLE:4"
      - "GOLDEN_CARROT:24"

# ─── Rewards ─────────────────────────────────────────────────
rewards:
  # Console commands run when a player wins. Placeholders: {winner}, {arena}
  win-commands:
    - "say {winner} won LavaRise in arena {arena}!"
  # Items given directly to the winner (no economy plugin needed). MATERIAL:AMOUNT
  win-items: []
  # Run when a player gets a kill. Placeholders: {killer}, {victim}
  kill-commands: []
  # Run when a player dies. Placeholders: {player}
  death-commands: []

# ─── Parties ─────────────────────────────────────────────────
# Players group up with /lr party and the leader's /lr join pulls everyone
# into the same arena.
party:
  max-size: 8

# ─── Matchmaking Queue ───────────────────────────────────────
# /lr queue waits for players, then drops them into an open arena (or a fresh
# procedural one) together once this many are waiting.
queue:
  min-players: 2

# ─── Custom Kits ─────────────────────────────────────────────
# Players save a personal loadout with /lr customkit save. When votable, a
# player's custom kit appears in the lobby kit vote once they propose it (vote
# for it), and the whole lobby can then vote it in. The winner applies to
# everyone, so it's a symmetric, opt-in bit of fun — turn off for strict balance.
custom-kits:
  votable: true

# ─── Game Mode Specific Settings ─────────────────────────────
modes:
  # Mini-game mode — structured arena-based matches
  minigame:
    enabled: true
    # Auto-reset arena after game ends
    auto-reset: true
    # Teleport players back to lobby after game
    teleport-on-end: true
    # Allow team mode
    teams-enabled: false
    # Team size (if teams enabled)
    team-size: 2

  # Survival Challenge — world-wide lava rising event
  survival:
    enabled: true
    # Which worlds are affected (empty = all loaded worlds)
    worlds: []
    # Radius from center (0,0) to fill with lava. 0 = entire world
    radius: 500
    # Announce to server when survival challenge starts
    announce: true

  # Admin Event — manually triggered special events
  event:
    enabled: true
    # Broadcast announcement to all players
    broadcast-start: true
    broadcast-end: true
    # Reward winner (requires Vault)
    reward-enabled: false
    reward-amount: 1000

# ─── Visual & Audio ──────────────────────────────────────────
effects:
  # Boss bar showing current lava level
  bossbar:
    enabled: true
    # Color: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    color: RED
    # Style: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
    style: SEGMENTED_10

  # Action bar messages
  actionbar:
    enabled: true
    # Show lava level in action bar
    show-lava-level: true
    # How often (ticks) to refresh the per-player HUD + lava warning.
    # Raise this (e.g. 20) on high-population servers to protect TPS.
    update-interval: 10

  # Scoreboard sidebar
  scoreboard:
    enabled: true

  # Give players a clear, daytime sky during games (per-player — doesn't change
  # the world) so night/storm matches stay well-lit. Reset when the game ends.
  clear-visibility: true

  # A particle burst where a player is eliminated.
  death-effect:
    enabled: true
    # Particle: LAVA, FLAME, EXPLOSION, SMOKE, CLOUD, …
    particle: LAVA

  # Particle effects on lava surface
  particles:
    enabled: true
    # Type: LAVA, FLAME, SMOKE_LARGE, DRIP_LAVA
    type: LAVA
    # Density: particles per block (lower = better performance)
    density: 2
    # How often (ticks) to emit surface particles. Raise/disable on big servers.
    interval: 10

  # Sound effects
  sounds:
    enabled: true
    # Sound when lava rises
    lava-rise: "block.lava.ambient"
    # Sound on game start
    game-start: "entity.ender_dragon.growl"
    # Sound on game end
    game-end: "ui.toast.challenge_complete"
    # Warning sound when lava is close
    warning: "block.note_block.pling"
    # Warning threshold — play warning when lava is within N blocks of player
    warning-distance: 5
