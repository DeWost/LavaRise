name: Publish to Marketplaces

# Publishes the release jar to Modrinth and Hangar whenever a GitHub Release
# is published (release-please cuts the release, then this runs).
#
# Setup (one-time) — add these repository secrets under Settings → Secrets:
#   MODRINTH_TOKEN   a Modrinth PAT with "Create versions" scope
#   HANGAR_TOKEN     a Hangar API key (Account → API Keys)
# And set the project IDs/slugs in the `with:` block below once the projects
# exist. If a token is missing, mc-publish skips that platform gracefully —
# so you can enable Modrinth and Hangar independently.

on:
  release:
    types: [published]
  workflow_dispatch: # allow manual re-publish of the latest build

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin jar
        run: ./gradlew shadowJar --no-daemon

      - name: Publish to Modrinth & Hangar
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: build/libs/!(*-sources|*-javadoc).jar

          name: LavaRise ${{ github.event.release.tag_name || github.ref_name }}
          version: ${{ github.event.release.tag_name || github.ref_name }}
          version-type: release
          changelog: ${{ github.event.release.body }}

          loaders: paper
          game-versions: 1.21.11
          java: 21

          # --- Modrinth ---
          # Replace with your Modrinth project slug/id once created.
          modrinth-id: lavarise
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # --- Hangar ---
          # Replace with your Hangar project slug (owner/Name → just the Name).
          hangar-id: DeWost/LavaRise
          hangar-token: ${{ secrets.HANGAR_TOKEN }}

          # Don't fail the whole run if one platform's token isn't configured yet.
          fail-mode: warn
