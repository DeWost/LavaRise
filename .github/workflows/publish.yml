name: Publish to Marketplaces (manual)

# Manual re-publish of the current build to Modrinth + Hangar.
#
# NOTE: Automatic publishing on each release is handled by the publish-jar job
# in release-please.yml (an `on: release` trigger can't fire from a release cut
# by GITHUB_TOKEN, so it lives there instead). Use THIS workflow only to re-push
# the latest build to the marketplaces out-of-band — e.g. after first adding the
# tokens, or to refresh a listing without cutting a new release.
#
# Setup (one-time) — add these repository secrets under Settings → Secrets:
#   MODRINTH_TOKEN   a Modrinth PAT with "Create versions" scope
#   HANGAR_TOKEN     a Hangar API key (Account → API Keys)
# And set the project IDs/slugs in the `with:` block below once the projects
# exist. If a token is missing, mc-publish skips that platform gracefully —
# so you can enable Modrinth and Hangar independently.

on:
  workflow_dispatch: # manual re-publish only

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin jar
        run: ./gradlew shadowJar --no-daemon

      - name: Publish to Modrinth & Hangar
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: build/libs/!(*-sources|*-javadoc).jar

          # name/version are auto-detected from the jar's plugin.yml.
          version-type: release

          loaders: paper
          game-versions: 1.21.11
          java: 21

          # --- Modrinth ---
          # Replace with your Modrinth project slug/id once created.
          modrinth-id: lavarise
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # --- Hangar ---
          # Replace with your Hangar project slug (owner/Name → just the Name).
          hangar-id: DeWost/LavaRise
          hangar-token: ${{ secrets.HANGAR_TOKEN }}

          # Don't fail the whole run if one platform's token isn't configured yet.
          fail-mode: warn
