name: Release Please

# Automates versioning & changelog from Conventional Commits. On every push to
# main it maintains a "release PR" that bumps the version (build.gradle.kts +
# CHANGELOG.md). Merging that PR creates the git tag + GitHub Release, and the
# publish-jar job below builds the plugin jar, attaches it to the release, and
# (token-gated) pushes it to Modrinth + Hangar — all in this same run, because a
# release cut by GITHUB_TOKEN can't trigger a separate `on: release` workflow.
on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When release-please cuts a release, build the plugin jar and attach it.
  # (A tag pushed by GITHUB_TOKEN can't trigger release.yml, so we build here.)
  publish-jar:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Plugin
        run: ./gradlew shadowJar

      - name: Attach jar to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Push the same jar to Modrinth + Hangar. Wired here (not in a
      # release-triggered workflow) because a release published by GITHUB_TOKEN
      # can't trigger `on: release`. Token-gated: mc-publish warns and skips a
      # platform whose secret is absent, so this is a no-op until the projects
      # and secrets exist. See docs/listing/README.md for setup.
      - name: Publish to Modrinth & Hangar
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: build/libs/!(*-sources|*-javadoc).jar
          name: LavaRise ${{ needs.release-please.outputs.tag_name }}
          version: ${{ needs.release-please.outputs.tag_name }}
          version-type: release
          loaders: paper
          game-versions: 1.21.11
          java: 21
          modrinth-id: lavarise
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          hangar-id: DeWost/LavaRise
          hangar-token: ${{ secrets.HANGAR_TOKEN }}
          fail-mode: warn
